# BOZOK PRO — Otomatik APK Derleme
name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Derle + Test + APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Repoyu çek
        uses: actions/checkout@v4

      - name: ☕ JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🤖 Android SDK kur
        uses: android-actions/setup-android@v3

      - name: 🧰 Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: 🔑 gradlew executable
        run: chmod +x gradlew

      - name: 🧪 Birim testleri
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: 📦 APK üret (debug + release)
        run: ./gradlew assembleDebug assembleRelease --no-daemon

      - name: 🔎 APK doğrula
        run: |
          find app/build/outputs/apk -name "*.apk" -type f -exec ls -lh {} \;

      - name: 📤 Artifact yükle
        uses: actions/upload-artifact@v4
        with:
          name: bozok-apk
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
